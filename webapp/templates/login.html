<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — Antifrágil</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Antifrágil" />
  <meta name="theme-color" content="#007563" />
</head>
<body>
  <div class="page">
    <h1 class="sr-only">Antifrágil</h1>
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Antifrágil" class="logo-login" />
    <p class="subtitulo">Introduce tu contraseña para continuar</p>

    {% if error %}
    <div class="aviso-error">{{ error }}</div>
    {% endif %}

    <form class="formulario" method="post">
      <input type="hidden" name="csrf" value="{{ token_csrf() }}">
      <label class="campo">
        <span>Contraseña</span>
        <input type="password" name="password" required autofocus />
      </label>
      <button type="submit" class="boton">Entrar</button>
    </form>
  </div>
</body>
</html>
