<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirmar cambios — Antifrágil</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page">
    <a class="volver" href="{{ url_for('editar', nombre=nombre) }}">← Volver a editar</a>
    <h1>Confirmar · {{ nombre }}</h1>
    <p class="subtitulo">Todavía no se ha guardado nada. Revisa el cambio:</p>

    <div class="lista comparativa">
      <div class="fila">
        <span class="etiqueta">Sesiones llevadas</span>
        <span class="antes">{{ antes.sesiones_llevadas }}</span>
        <span class="flecha">→</span>
        <span class="despues">{{ despues.sesiones_llevadas }}</span>
      </div>
      <div class="fila">
        <span class="etiqueta">Pendiente de pago</span>
        <span class="antes">{{ "Sí" if antes.pendiente_pago else "No" }}</span>
        <span class="flecha">→</span>
        <span class="despues">{{ "Sí" if despues.pendiente_pago else "No" }}</span>
      </div>
    </div>

    <form method="post" action="{{ url_for('guardar', nombre=nombre) }}">
      <input type="hidden" name="sesiones_llevadas" value="{{ despues.sesiones_llevadas }}" />
      <input type="hidden" name="pendiente_pago" value="{{ 'si' if despues.pendiente_pago else 'no' }}" />
      <button type="submit" class="boton">Confirmar y guardar</button>
    </form>
  </div>
</body>
</html>
