<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configurar contraseña — Antifrágil</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=version_estaticos) }}" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}" />
  <meta name="theme-color" content="#007563" />
</head>
<body>
  <div class="page">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Antifrágil" class="logo-login" />
    <h1>Configura tu contraseña</h1>
    <p class="subtitulo">Es la primera vez que se arranca esta web. Elige una contraseña para proteger tus datos antes de continuar.</p>

    {% if error %}
    <div class="aviso-error">{{ error }}</div>
    {% endif %}

    <form class="formulario" method="post">
      <label class="campo">
        <span>Contraseña (mínimo 8 caracteres)</span>
        <input type="password" name="password" required minlength="8" autofocus />
      </label>
      <label class="campo">
        <span>Repite la contraseña</span>
        <input type="password" name="password2" required minlength="8" />
      </label>
      <button type="submit" class="boton">Guardar contraseña</button>
    </form>
  </div>
</body>
</html>
